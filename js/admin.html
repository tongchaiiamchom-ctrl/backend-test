    var d=n.task||o.task||n.name||o.name||n.username||o.username||n.year||o.year;return d==null?"":String(d)}
  async function load(){var qq=sb.from("audit_logs").select("*").order("at",{ascending:false}).limit(200);
    if(tf.value)qq=qq.eq("table_name",tf.value);if(uf.value.trim())qq=qq.ilike("username",uf.value.trim().toUpperCase());
    var rows=await q(qq);box.replaceChildren(h("table",{},h("tr",{},["เวลา","ผู้ใช้","การกระทำ","ตาราง","รายละเอียด"].map(function(x){return h("th",{},x)})),
      rows.map(function(l){return h("tr",{},h("td",{},fmt(l.at)),h("td",{},l.username||"-"),h("td",{},l.action),h("td",{},l.table_name),
        h("td",{},sum(l),l.old_data||l.new_data?h("details",{},h("summary",{class:"muted"},"ดูข้อมูลดิบ"),h("pre",{},JSON.stringify({old:l.old_data,new:l.new_data},null,1))):null))})),
      rows.length?null:h("p",{class:"muted"},"ไม่พบประวัติ"))}
  tf.addEventListener("change",function(){load().catch(fail)});uf.addEventListener("input",function(){clearTimeout(uf._t);uf._t=setTimeout(function(){load().catch(fail)},400)});
  m.append(h("div",{class:"card"},h("div",{class:"bar"},tf,uf,h("span",{class:"muted"},"แสดง 200 รายการล่าสุด")),box));await load()}

/* ---------- Import (จากไฟล์ migrate.html) ---------- */
async function viewImport(m){
  var file=h("input",{type:"file",accept:".json,application/json"}),box=h("div");
  file.addEventListener("change",async function(){box.replaceChildren();var j;
    try{j=JSON.parse(await file.files[0].text())}catch(e){box.append("ไฟล์ไม่ใช่ JSON");return}
    if(j.format!=="gantt-export-v1"||!j.accounts){box.append("ไม่ใช่ไฟล์ที่สร้างจาก migrate.html");return}
    var names=Object.keys(j.accounts),cs=names.map(function(n){return h("input",{type:"checkbox",checked:true,value:n})});
    box.append(h("p",{},"เลือกบัญชีที่ต้องการนำเข้า (ข้อมูลจะถูกรวมและตัดรายการซ้ำ)"),names.map(function(n,i){return h("label",{class:"chk"},cs[i],n)}),
      h("button",{class:"btn pri",onclick:function(){runImport(j,cs.filter(function(c){return c.checked}).map(function(c){return c.value})).catch(fail)}},"ตรวจสอบและนำเข้า"))});
  m.append(h("div",{class:"card"},h("h3",{},"นำเข้าข้อมูลเดิม"),h("p",{class:"muted"},"เลือกไฟล์ .json ที่ได้จาก migrate.html (ทำซ้ำได้หลายไฟล์ ระบบข้ามรายการที่มีอยู่แล้ว ไม่ทับของเดิม)"),file,box))}

async function runImport(j,sel){
  var T=new Map(),H=new Map(),N={},B={},bad=0,Y=/^\d{4}$/;
  sel.forEach(function(n){var a=j.accounts[n]||{};
    Object.keys(a.yearly||{}).forEach(function(y){var l=a.yearly[y];if(!Y.test(y)||!Array.isArray(l))return;
      l.forEach(function(t){var r={y:y,phase:t.phase,no:Number(t.no),task:String(t.task||"").trim(),date_text:String(t.date||"").trim(),color:t.color==="blue"?"blue":"lightblue"};
        if(PHASES.indexOf(r.phase)<0||!r.task||r.task.length>200||!DATE_RE.test(r.date_text)||!(r.no>=1)){bad++;return}
        T.set(y+"|"+r.phase+"|"+r.task+"|"+r.date_text,r)})});
    var ex=a.extra||{};
    Object.keys(ex.names||{}).forEach(function(y){if(Y.test(y)&&ex.names[y]&&!N[y])N[y]=String(ex.names[y]).slice(0,200)});
    Object.keys(ex.holidays||{}).forEach(function(y){if(Y.test(y))(ex.holidays[y]||[]).forEach(function(x){if(!ISO_RE.test(x.date||""))return;
      var nm=String(x.name||"Holiday").trim().slice(0,100)||"Holiday";H.set(y+"|"+x.date+"|"+nm,{y:y,date:x.date,name:nm})})});
    Object.keys(a.board||{}).forEach(function(y){var b=a.board[y];if(Y.test(y)&&b&&((b.strokes||[]).length||(b.items||[]).length)&&!B[y])B[y]=b})});
  var years=[];function addY(y){y=String(y);if(Y.test(y)&&+y>=2000&&+y<=2100&&years.indexOf(y)<0)years.push(y)}
  T.forEach(function(r){addY(r.y)});H.forEach(function(r){addY(r.y)});Object.keys(N).forEach(addY);Object.keys(B).forEach(addY);
  await loadProjects();var yearOf={};projects.forEach(function(p){yearOf[p.id]=String(p.year)});
  var exT={},exH={},exB={};
  (await all("tasks","project_id,phase,task,date_text","id")).forEach(function(t){exT[yearOf[t.project_id]+"|"+t.phase+"|"+t.task+"|"+t.date_text]=1});
  (await all("holidays","project_id,date,name","id")).forEach(function(t){exH[yearOf[t.project_id]+"|"+t.date+"|"+t.name]=1});
  (await all("boards","project_id")).forEach(function(b){exB[yearOf[b.project_id]]=1});
  var nT=[],nH=[],nB=years.filter(function(y){return B[y]&&!exB[y]});
  T.forEach(function(r,k){if(!exT[k])nT.push(r)});H.forEach(function(r,k){if(!exH[k])nH.push(r)});
  if(!confirm("สรุปก่อนนำเข้า\n• กิจกรรมใหม่ "+nT.length+" (ซ้ำ/มีอยู่แล้ว "+(T.size-nT.length)+", ข้อมูลไม่ถูกต้อง "+bad+")\n• วันหยุดใหม่ "+nH.length+"\n• Board ใหม่ "+nB.length+" ปี\n• ปีที่เกี่ยวข้อง: "+years.join(", ")+"\n\nดำเนินการต่อ?"))return;
  for(var i=0;i<years.length;i++)await q(sb.from("projects").upsert({year:+years[i]},{onConflict:"year"}).select("id"));
  await loadProjects();var pid={};projects.forEach(function(p){pid[String(p.year)]=p});
  for(i=0;i<years.length;i++){var p=pid[years[i]];if(N[years[i]]&&!p.name)await q(sb.from("projects").update({name:N[years[i]]}).eq("id",p.id).select("id"))}
  async function chunks(t,rows){for(var k=0;k<rows.length;k+=200)await q(sb.from(t).insert(rows.slice(k,k+200)).select("id"))}
  await chunks("tasks",nT.map(function(r){return{project_id:pid[r.y].id,phase:r.phase,no:r.no,task:r.task,date_text:r.date_text,color:r.color}}));
  await chunks("holidays",nH.map(function(r){return{project_id:pid[r.y].id,date:r.date,name:r.name}}));
  for(i=0;i<nB.length;i++)await q(sb.from("boards").upsert({project_id:pid[nB[i]].id,data:B[nB[i]]},{onConflict:"project_id"}).select("project_id"));
  toast("นำเข้าเสร็จ: กิจกรรม "+nT.length+", วันหยุด "+nH.length+", Board "+nB.length);shell("imp")}

if(!window.supabase||!CFG.SUPABASE_URL||/YOUR_/.test(CFG.SUPABASE_URL+CFG.SUPABASE_KEY)){app.append(h("main",{},h("div",{class:"card err"},"ยังไม่ได้ตั้งค่า js/config.js")))}
else{sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);start()}
})();
